services:
  mongodb:
    image: mongo:7.0
    container_name: folioforge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folioforge-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/folioforge
      - AUTH_SECRET=${AUTH_SECRET:-folioforge-docker-dev-secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - portfolio_data:/app/data

  # Dedicated frontend dev/preview container when running decoupled Vite UI
  frontend:
    image: node:22-alpine
    container_name: folioforge-frontend
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://backend:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
  portfolio_data:
